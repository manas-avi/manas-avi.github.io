{%- comment -%}
  Image figure: 1 to 4 columns, optional caption.
  {% include figure.html images=page.gallery.images caption=page.gallery.caption columns=2 %}
{%- endcomment -%}
{%- assign cap = include.caption | strip -%}
<figure class="fig" style="--cols: {{ include.columns | default: 1 }}">
  <div class="fig-grid">
    {%- for image in include.images %}
    <img src="{{ image.url }}" alt="{{ image.alt }}" loading="lazy" decoding="async">
    {%- endfor %}
  </div>
  {%- if cap != '' %}
  <figcaption>{{ cap }}</figcaption>
  {%- endif %}
</figure>
