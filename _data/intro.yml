# Homepage introduction. `lead` is the one sentence a visitor reads first;
# `bio` is markdown and may contain links.
role: Postdoctoral researcher, Materiali Molli Lab, ISTA

lead: >
  I design objects that fold, bend and move: lighting displays folded from
  circuit boards, shapes unfolded into paper, and soft robots driven by
  light-activated muscles.

bio: >
  I am a postdoctoral researcher at the Institute of Science and Technology
  Austria (ISTA), working in the Materiali Molli Lab with
  [Prof. Jérémie Palacci](https://ista.ac.at/en/research/palacci-group/).
  Before this, I completed my PhD with [Prof. Bernd Bickel](https://berndbickel.com/)
  on the design and control of deformable structures, from 3D lighting displays
  made of folded PCBs to musculoskeletal soft robots with laser-controlled
  artificial muscles. You can read more in my [publications](/publications/) or my
  [thesis](https://research-explorer.ista.ac.at/record/20276).
  I'm always happy to talk about soft robotics, fabrication and new project ideas.
