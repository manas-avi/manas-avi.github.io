# PIPELINE SETTINGS
file_module ./data/modules/1515.module
file_connector ./data/modules/conn.module
placer_iters 4
placer_tries 1
# Optional target LED density, in LED modules per cm^2 of the shape's TOTAL surface area.
# Omit or set <= 0 to keep the built-in per-face area fill-fraction heuristic. When set, the
# Cutter turns it into a whole-shape LED budget and spreads that budget over all faces as
# uniformly as their areas and capacities allow, then each face's share is placed. It is an
# upper bound: the placer still drops LEDs that do not fit, and max_leds_per_face still
# caps the result. The Cutter logs the budget and the placer logs "Density: target N
# placed M ..." per face.
# led_density_per_cm2 1.5
# Floor on each face's apportioned share, so a low led_density_per_cm2 does not round whole
# triangles down to zero and leave them dark. Default 1 = every triangle that can hold a
# module keeps one, even if that puts the total above the density budget. 0 = pure
# proportional split (faces whose share rounds to 0 are left empty). Never exceeds what a
# face can physically fit, nor max_leds_per_face. Only relevant when a density is set.
min_leds_per_face 1
# Placer Phase-1 module spreading. 1 (default) = Lloyd relaxation: each site is moved onto the
# centroid of its clipped Voronoi cell until convergence, which needs no weights and keeps every
# site inside the domain on its own. 0 = the older HLBFGS energy descent, for which placer_w_cvt
# and placer_w_tri (and PCBEND_WCVT / PCBEND_WTRI) set the spread-vs-containment balance; those
# are inert under Lloyd. placer_lloyd_iters caps the sweeps (it also stops on a movement
# tolerance, so the cap is rarely reached).
placer_phase1_lloyd 0
# placer_lloyd_iters 50
router_min_trace_spacing_mm 0.2
# HINGE PARAMETERS
track_width_mm 1.7
inner_diameter_mm 1.0
outer_diameter_mm 1.0
# UNFOLDER SETTINGS
# heuristic: max_dihedral_angle or min_perimeter_heuristic
heuristic max_dihedral_angle
fab_margin 0.5
num_patches_desired 1
use_cli_interface 1
use_half_hinges 1
# save_unfold_svgs: also dump the unfolded sheet as <mesh>-unfold.svg (plain outline) and
# <mesh>-unfold-fab.svg (per-edge colors, gluing aid) next to the .sheet file. Debug only,
# nothing downstream reads them.
save_unfold_svgs 1
# unfold_svg_tabs: draw a glue tab on every cut edge of <mesh>-unfold-fab.svg that has
# free space for one next to its triangle (same color as the edge). Needs save_unfold_svgs.
unfold_svg_tabs 1
# max glue-tab height in mm; each tab is also capped at 0.4 * its edge length
unfold_svg_tab_height_mm 3.0
# LEDIFIER
use_cli_interface_ledifier 1
# CHAMFERER SETTINGS
use_cli_interface_chamfer 1
chamfer_mode 0
# FABRICATION SETTINGS
trace_width_mm 0.2
trace_clearance_mm 0.2
plane_clearance_mm 0.2
edge_clearance_mm 0.25
via_clearance_mm 0.2
silkscreen_width_mm 0.15
edgecuts_width_mm 0.1
plane_width_mm 1.0e-6
# INTERNAL SETTINGS
## CONCORDE
concorde_scaling 1.0e3
concorde_led_threshold 7
## CLIPPER
clipper_scaling 1.0e6
clipper_arc_tolerance 1.0e3
## OTHER
float_eq_eps 1.0e-2
plane_inset_depth_mm 0.25
min_plane_io_clearance_mm 0.2
data_inset_depth_mm 0.55
data_inset_depth_wide_mm 0.75
led_inset_depth_mm 0.95
led_inset_depth_wide_mm 1.15
shrink_half_hinges_margin_mm 0.35
detour_inset_depth_mm 0.35
plane_erosion_factor 0.2
led_offset_x_mm 0.2
led_offset_y_mm 0.2
min_io_spacing_mm 1.2
# ROUTING STEP TOGGLES (1 = run, 0 = skip). Skipped for this config; the heuristic
# keep-out subroute stage and the repulsive relax post-process only run for the
# capacitive configs (capacitive-first / capacitive-flex).
use_heuristic_router 0
use_relax_router 0
